<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbital Breach</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #04060e;
      overflow: hidden;
    }

    * { cursor: none !important; }
    @media (pointer: coarse) { * { cursor: auto !important; } }

    #ob-cursor {
      position: fixed;
      top: 0; left: 0;
      z-index: 99999;
      width: 28px; height: 28px;
      pointer-events: none;
      mix-blend-mode: screen;
      color: #00e5ff;
    }
    #ob-cursor::before {
      content: "";
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid #00e5ff;
      transition: transform .2s ease, border-color .2s ease;
    }
    #ob-cursor::after {
      content: "";
      position: absolute;
      width: 3px; height: 3px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 8px #00e5ff;
    }
    #ob-cursor.ob-hot::before { transform: scale(1.7); border-color: #ff00ff; }
    #ob-cursor.ob-hot::after  { background: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
    #ob-cursor.ob-hidden { display: none; }

    .wc-root {
      position: fixed; inset: 0; z-index: 20;
      background: #04060e;
      overflow: hidden;
      cursor: auto !important;
      touch-action: none;
      animation: wc-fade-in .6s ease both;
    }

    @keyframes wc-fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wc-fade-out { from { opacity: 1; } to { opacity: 0; } }
    .wc-root.wc-fadeout { animation: wc-fade-out .3s ease forwards; }

    .wc-stage { position: fixed; inset: 0; overflow: hidden; }

    .wc-layer {
      position: absolute;
      background: url('./orbital-breach-art.png') center / contain no-repeat;
      background-color: #04060e;
      will-change: transform;
      transform-origin: center center;
      inset: -6%;
    }

    .wc-ui {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: clamp(48px, 22vh, 160px);
      pointer-events: none;
    }

    .wc-btn {
      pointer-events: auto;
      position: relative;
      cursor: pointer !important;
      padding: clamp(14px,2vh,22px) clamp(44px,8vw,96px);
      background: rgba(4, 6, 14, 0.48);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(11px, 1.5vw, 15px);
      letter-spacing: clamp(4px, 1vw, 9px);
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      touch-action: manipulation;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: border-color .3s, box-shadow .3s, transform .15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wc-btn::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(
        circle at var(--bx,50%) var(--by,50%),
        rgba(0,229,255,.30) 0%,
        rgba(255,28,255,.22) 45%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity .35s;
    }

    .wc-btn:hover::before,
    .wc-btn:focus::before { opacity: 1; }

    .wc-btn:hover,
    .wc-btn:focus {
      border-color: rgba(255,255,255,.7);
      box-shadow:
        0 0 0 1px rgba(0,229,255,.25),
        0 0 40px rgba(0,229,255,.15),
        0 0 40px rgba(255,28,255,.15);
    }

    .wc-btn:active { transform: scale(0.975); }

    .wc-c {
      position: absolute; width: 8px; height: 8px;
      border: 1px solid rgba(255,255,255,.45);
      transition: width .3s, height .3s, border-color .3s;
    }
    .wc-btn:hover .wc-c { width: 13px; height: 13px; border-color: #fff; }
    .wc-c.tl { top:    4px; left:  4px; border-right: none; border-bottom: none; }
    .wc-c.tr { top:    4px; right: 4px; border-left:  none; border-bottom: none; }
    .wc-c.bl { bottom: 4px; left:  4px; border-right: none; border-top:    none; }
    .wc-c.br { bottom: 4px; right: 4px; border-left:  none; border-top:    none; }

    .wc-btn-label {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 12px;
    }

    .wc-arrow {
      font-size: 1.3em; letter-spacing: 0;
      transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }
    .wc-btn:hover .wc-arrow { transform: translateX(8px); }

    .embed-root {
      position: fixed;
      inset: 0;
      background: #04060e;
    }

    .embed-root iframe {
      display: block;
      border: 0;
      width: 100vw;
      height: 100vh;
      background: #04060e;
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(0, 229, 255, 0.08), rgba(4, 6, 14, 0.94) 55%),
        #04060e;
      color: #effcff;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      transition: opacity .3s ease;
    }

    .loader-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .fallback-link {
      display: none;
      margin-top: 20px;
      color: #7ffcff;
      text-decoration: none;
    }

    .loader-overlay.show-fallback .fallback-link {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="wc-root" id="welcome">
    <div class="wc-stage">
      <div class="wc-layer" id="wc-layer" data-depth="0.012"></div>
    </div>
    <div class="wc-ui">
      <button class="wc-btn" id="wc-btn">
        <span class="wc-c tl"></span>
        <span class="wc-c tr"></span>
        <span class="wc-c bl"></span>
        <span class="wc-c br"></span>
        <span class="wc-btn-label">Click to BREACH <span class="wc-arrow">&rarr;</span></span>
      </button>
    </div>
  </div>

  <script>
    var LIVE_URL = "https://orbital-breach.vercel.app/?embed=1";
    var welcome = document.getElementById("welcome");
    var layer   = document.getElementById("wc-layer");
    var btn     = document.getElementById("wc-btn");
    var depth   = parseFloat(layer.dataset.depth || "0.012");

    var mouseNx = 0;
    var mouseNy = 0;

    // ── Custom cursor ────────────────────────────────────────────────────────
    var curEl = null;
    var curMx = window.innerWidth  / 2;
    var curMy = window.innerHeight / 2;
    var curCx = curMx;
    var curCy = curMy;

    function initCursor() {
      if (window.matchMedia("(pointer: coarse)").matches) return;
      curEl = document.createElement("div");
      curEl.id = "ob-cursor";
      curEl.innerHTML =
        '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width=".8"' +
        ' style="position:absolute;inset:-6px;width:40px;height:40px;opacity:.6">' +
        '<line x1="20" y1="0"  x2="20" y2="10"/>' +
        '<line x1="20" y1="30" x2="20" y2="40"/>' +
        '<line x1="0"  y1="20" x2="10" y2="20"/>' +
        '<line x1="30" y1="20" x2="40" y2="20"/>' +
        '</svg>';
      document.body.appendChild(curEl);
    }

    function cursorTick() {
      if (curEl) {
        curCx += (curMx - curCx) * 0.25;
        curCy += (curMy - curCy) * 0.25;
        curEl.style.transform =
          "translate(" + curCx + "px," + curCy + "px) translate(-50%,-50%)";
      }
      requestAnimationFrame(cursorTick);
    }

    // ── Parallax ─────────────────────────────────────────────────────────────
    function enterFullscreen() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    }

    function onMove(event) {
      mouseNx = (event.clientX / window.innerWidth  - 0.5) * 2;
      mouseNy = (event.clientY / window.innerHeight - 0.5) * 2;
      curMx   = event.clientX;
      curMy   = event.clientY;
    }

    function onButtonMove(event) {
      var rect = btn.getBoundingClientRect();
      btn.style.setProperty("--bx", ((event.clientX - rect.left) / rect.width  * 100) + "%");
      btn.style.setProperty("--by", ((event.clientY - rect.top)  / rect.height * 100) + "%");
    }

    function tick() {
      var ox = mouseNx * depth * window.innerWidth;
      var oy = mouseNy * depth * window.innerHeight;
      layer.style.transform = "translate(" + ox + "px," + oy + "px)";
      requestAnimationFrame(tick);
    }

    // ── Game load ─────────────────────────────────────────────────────────────
    function loadGame() {
      enterFullscreen();
      welcome.classList.add("wc-fadeout");
      welcome.addEventListener("animationend", replaceWithGame, { once: true });
    }

    function replaceWithGame() {
      document.body.innerHTML = [
        '<div class="embed-root">',
        '  <iframe src="' + LIVE_URL + '" allow="fullscreen; pointer-lock; autoplay; gamepad; xr-spatial-tracking" allowfullscreen style="border:0;width:100vw;height:100vh"></iframe>',
        '  <div class="loader-overlay" id="loader">',
        '    <div>',
        '      <div>Opening Breach Link</div>',
        '      <a class="fallback-link" href="' + LIVE_URL + '" target="_blank" rel="noreferrer noopener">Open in new tab &rarr; vercel.app</a>',
        '    </div>',
        '  </div>',
        '</div>'
      ].join("");

      // Re-attach cursor to the new DOM (body.innerHTML was replaced)
      curEl = null;
      initCursor();

      var iframe = document.querySelector("iframe");
      var loader = document.getElementById("loader");
      var fallbackTimer = window.setTimeout(function() {
        loader.classList.add("show-fallback");
      }, 4000);

      iframe.addEventListener("load", function() {
        window.clearTimeout(fallbackTimer);
        loader.classList.add("is-hidden");
        // Game iframe loaded — its own cursor system takes over; hide ours
        if (curEl) curEl.classList.add("ob-hidden");
      }, { once: true });
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    window.addEventListener("mousemove", onMove);
    btn.addEventListener("mousemove", onButtonMove);
    btn.addEventListener("click",      loadGame);
    btn.addEventListener("mouseenter", function() { if (curEl) curEl.classList.add("ob-hot");    });
    btn.addEventListener("mouseleave", function() { if (curEl) curEl.classList.remove("ob-hot"); });

    initCursor();
    requestAnimationFrame(tick);
    requestAnimationFrame(cursorTick);
  </script>
</body>
</html>
