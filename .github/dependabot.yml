version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/client"
    target-branch: staging
    open-pull-requests-limit: 3
    groups:
      colyseus:
        patterns: ["@colyseus/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@colyseus/*", "three", "@types/three"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/server"
    target-branch: staging
    open-pull-requests-limit: 3
    groups:
      colyseus:
        patterns: ["@colyseus/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@colyseus/*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    schedule:
      interval: weekly
